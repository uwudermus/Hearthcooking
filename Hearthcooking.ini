; Hearthcooking settings. Most can also be changed in game (SKSE Menu Framework: Hearthcooking).

[General]
Enabled = 1            ; 0: the cooking pot and the oven open the game's own menu, as if Hearthcooking weren't installed

[Kitchen]
TiltDegrees = 56       ; how far you look down on the kitchen
Zoom = 1.0             ; above 1 closer, below 1 further back

[Play]
MouseSpeed = 1.0
UiScale = 1.3          ; the recipe book, the recipe card, the buttons and text
Sound = 1              ; 0 to cook in silence
Volume = 0.5           ; the kitchen: chopping, logs, the pot (0 - 2)
Ambience = 1.0         ; the fire's crackle, the simmer, the sizzle (0 - 2)
EffectsVolume = 1.0    ; menu clicks (0 - 2)
Hints = 1              ; the line at the bottom saying what to do next

[Debug]
Overlay = 0            ; 1 marks what the mouse can grab, to check it lines up
LogInput = 0

[Meshes]
; The kitchen uses the game's own meshes wherever your load order has one; Data\SKSE\Plugins\Hearthcooking.log lists
; what was picked for each. Set a mesh here (a path under Data\meshes, as the game writes it) to use another one, or
; "ours" for Hearthcooking's own. <Name>Turn turns it about the vertical (degrees), <Name>Tilt about the left-right
; axis, for a mesh that comes in facing the wrong way (the oven's mouth should face you).
; Names: Table, Pot, Ladle, Knife, Board, Bowl, Plate, Log, SaltBowl, Salt, FirePit, Spit, Oven, Peel
;Pot = Clutter\SomeFolder\SomePot.nif
;OvenTurn = 180
; The clutter set about the kitchen: Clutter1 .. Clutter9 replace what's picked (none for no clutter at all).
;Clutter1 = none

[Recipes]
; Recipes not cooked by hand (they cook the game's own way), by name, separated by commas
Skip = Cookie,Muffin
